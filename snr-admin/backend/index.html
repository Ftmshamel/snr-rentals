<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S&R Rentals API</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
        --border: #1f2937;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(
            circle at top,
            rgba(34, 197, 94, 0.18),
            transparent 35%
          ),
          linear-gradient(180deg, #020617 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        width: min(92vw, 560px);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: rgba(17, 24, 39, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.6;
        color: var(--muted);
      }

      code {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.14);
        color: #bbf7d0;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .footer {
        margin-top: 20px;
        font-size: 0.9rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">API deployment</div>
      <h1>S&amp;R Rentals Bridge API</h1>
      <p>
        This Vercel project serves the backend routes under <code>/api/*</code>.
      </p>
      <p>
        If you want the admin dashboard, open the separate frontend Vercel
        project instead.
      </p>
      <div class="footer">
        If a request hits this page, the API is deployed but the browser root is
        not the app UI.
      </div>
    </main>
  </body>
</html>
